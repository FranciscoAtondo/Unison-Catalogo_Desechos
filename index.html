<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cliente Catalogo Residuos peligrosos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Cliente Catalogo Residuos peligrosos</h1>

        <!-- Método HTTP -->
        <label for="method">Método:</label>

        <select id="method">
            <option value="GET">GET</option>
			<option value="POST">POST</option>
            <option value="PATCH">PATCH</option>
            <option value="DELETE">DELETE</option>
        </select>


        <!-- URL -->
        <label for="url">URL:</label>

        <input
            type="text"
            id="url"
            value="http://localhost:3000/substancias"
        >


        <!-- Datos -->
        <h3>Datos</h3>

		<!-- ID -->
        <label for="id">ID:</label>
        <input
            type="number"
            id="id"
            placeholder="Para PATCH o DELETE"
        >

		<!-- Nivel -->
		<label for="nivel">Nivel:</label>
		<input
			type="number"
			id="nivel"
		>
		
		<!-- Estante -->
		<label for="estante">Estante:</label>
		<input
			type="text"
			id="estante"
		>
		
		<!-- Nombre -->
		<label for="nombre">Nombre:</label>
		<input
			type="text"
			id="nombre"
		>

        <!-- Marca -->
		<label for="marca">Marca:</label>
		<input
			type="text"
			id="marca"
		>

        <!-- Cantidad -->
		<label for="cantidad">Cantidad:</label>
		<input
			type="text"
			id="cantidad"
		>

        <!-- Unidades -->
		<label for="unidades">Unidades:</label>
		<input
			type="number"
			id="unidades"
		>

        <!-- Fecha AD -->
		<label for="fecha_ad">Fecha AD:</label>
		<input
			type="date"
			id="fecha_ad"
		>

        <!-- Fecha AP -->
		<label for="fecha_ap">Fecha_AP:</label>
		<input
			type="date"
			id="fecha_ap"
		>

		<h3>Peligrosidad</h3>

		<label>
			<input type="checkbox" id="pel_cor">
			Corrosivo
		</label>

		<label>
			<input type="checkbox" id="pel_tox">
			Tóxico
		</label>

		<label>
			<input type="checkbox" id="pel_mut">
			Mutagénico
		</label>

		<label>
			<input type="checkbox" id="pel_inf">
			Inflamable
		</label>

		<label>
			<input type="checkbox" id="pel_irr">
			Irritante
		</label>

		<label>
			<input type="checkbox" id="pel_exp">
			Explosivo
		</label>

		<label>
			<input type="checkbox" id="pel_com">
			Comburente
		</label>

		<label>
			<input type="checkbox" id="pel_gas">
			Gas
		</label>

        <!-- Botón -->
        <button id="execute">
            EJECUTAR
        </button>


        <!-- Respuesta -->
        <h3>Respuesta</h3>

        <pre id="response"></pre>

    </div>

    <script src="script.js"></script>

</body>

</html>
```
